<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dreaming Rose - Panel de Creador</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />

    <link rel="stylesheet" href="../css/dstyle.css">
</head>
<body>

    <div class="dashboard-container">
        
        <aside class="sidebar">
            <div class="logo">
                <h2>Dreaming Rose</h2>
            </div>
            <nav class="nav-menu">
                <a href="#" class="active"><span class="material-symbols-outlined">home</span> Inicio</a>
                <a href="#"><span class="material-symbols-outlined">library_books</span> Biblioteca de Juegos</a>
                <a href="#"><span class="material-symbols-outlined">build</span> Publica tu Juego</a>
                <a href="#"><span class="material-symbols-outlined">settings</span> Configuración</a>
            </nav>
        </aside>

        <main class="main-content">
            
            <header class="header">
                <h1>Mi Panel de Creador</h1>
                <div class="user-dropdown">
                    <div class="user-profile" id="userProfileBtn">
                        <span>UsuarioPruebam</span>
                        <span class="material-symbols-outlined icon-arrow">expand_more</span>
                    </div>
                    
                    <div class="dropdown-menu" id="userDropdown">
                        <a href="#">
                            <span class="material-symbols-outlined">switch_account</span>
                            Cambiar de cuenta
                        </a>
                        <a href="#" class="logout-btn">
                            <span class="material-symbols-outlined">logout</span>
                            Cerrar sesión
                        </a>
                    </div>
                </div>
            </header>

            <div class="dashboard-grid">
            </div>
        </main>
    </div>

    <script>
    const navLinks = document.querySelectorAll('.nav-menu a');
    navLinks.forEach(link => {
        link.addEventListener('click', function(e) {
            e.preventDefault(); // Evita que la página salte al hacer clic en '#'
            
            // 1. Quita el fondo rosa de todos los enlaces
            navLinks.forEach(item => item.classList.remove('active'));
            
            // 2. Le pone el fondo rosa únicamente al que acabas de presionar
            this.classList.add('active');
        });
    });
    // Lógica del menú desplegable del usuario
    const userProfileBtn = document.getElementById('userProfileBtn');
    const userDropdownContainer = document.querySelector('.user-dropdown');
    const userDropdown = document.getElementById('userDropdown');

    userProfileBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        userDropdownContainer.classList.toggle('active');
        userDropdown.classList.toggle('show');
    });

    document.addEventListener('click', (e) => {
        if (!userDropdownContainer.contains(e.target)) {
            userDropdownContainer.classList.remove('active');
            userDropdown.classList.remove('show');
        }
    });
</script>
</body>
</html>
