<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08080c"><meta name="robots" content="noindex,nofollow"><title>Reportes de juegos | Dreaming Rose</title><link rel="icon" href="assets/Icons/rosaaa MArlo icono.png"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin-console.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
.reports-page{min-height:100vh;padding:110px 0 60px;background:radial-gradient(ellipse at top left,#ff416812,transparent 35%),#08080c}.reports-wrap{width:min(1180px,calc(100% - 32px));margin:auto}.reports-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:24px}.reports-head h1{margin:6px 0}.reports-note{padding:14px;border:1px solid #343044;border-radius:10px;background:#12121b;color:#bbb;margin-bottom:18px}.reports-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.reports-stat,.report-card{border:1px solid #292936;border-radius:12px;background:#111118;padding:16px}.reports-stat strong{display:block;font-size:25px}.reports-stat span,.report-meta{color:#9da0ae;font-size:12px}.reports-toolbar{display:flex;gap:10px;margin-bottom:16px}.reports-toolbar select{background:#171720;color:white;border:1px solid #333344;border-radius:8px;padding:11px}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.reports-list{display:grid;gap:12px}.report-card h2{margin:0 0 8px;font-size:18px}.report-card p{color:#c4c4ce;line-height:1.55;overflow-wrap:anywhere}.report-pill{display:inline-block;border:1px solid #663044;color:#ff9ab0;border-radius:99px;padding:4px 9px;font-size:10px;font-weight:800}.report-actions{display:grid;gap:9px;margin-top:12px}.report-actions textarea{width:100%;min-height:75px;background:#09090e;border:1px solid #343442;color:white;border-radius:8px;padding:10px}.report-actions select{background:#171720;color:white;border:1px solid #343442;border-radius:8px;padding:10px}.report-actions button,.reports-btn{border:1px solid #663044;background:#24131c;color:#ff9ab0;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}.reports-empty{padding:28px;text-align:center;border:1px dashed #383846;border-radius:12px;color:#aaa}@media(max-width:650px){.reports-stats{grid-template-columns:1fr}.reports-toolbar{flex-direction:column}}
</style></head><body><header class="catalog-header"><a class="brand" href="index.html"><img src="assets/Icons/rosaaa MArlo icono.png" alt=""><span>DREAMING ROSE</span></a><nav><a href="moderacion.html">Juegos</a><a class="active" href="reportes.html">Reportes</a><a href="index.html">Hub</a></nav><a class="publish" href="moderacion.html">Volver</a></header><main class="reports-page"><div class="reports-wrap"><div class="reports-head"><div><p class="eyebrow">CENTRO DE MODERACIÓN</p><h1>Reportes de juegos</h1><p class="reports-meta">Revisá las denuncias enviadas por la comunidad.</p></div><button id="refreshReports" class="reports-btn" type="button">↻ ACTUALIZAR</button></div><div id="reportsNotice" class="reports-note">Verificando permisos…</div><section class="reports-stats"><div class="reports-stat"><strong id="countPending">—</strong><span>PENDIENTES</span></div><div class="reports-stat"><strong id="countReview">—</strong><span>EN REVISIÓN</span></div><div class="reports-stat"><strong id="countResolved">—</strong><span>RESUELTOS / DESCARTADOS</span></div></section><div class="reports-toolbar"><label class="sr-only" for="reportsFilter">Filtrar reportes por estado</label><select id="reportsFilter"><option value="pendiente">Pendientes</option><option value="en_revision">En revisión</option><option value="resuelto">Resueltos</option><option value="descartado">Descartados</option><option value="todos">Todos</option></select></div><section id="reportsList" class="reports-list" aria-live="polite" aria-busy="false"><div class="reports-empty">Cargando reportes…</div></section></div></main><script type="module" src="js/reportes.js?v=20261110-frontend-audit-v2"></script></body></html>
